# Local PostgreSQL for development: `pnpm db:up` / `pnpm db:down`.
# Tests start their own throwaway container with the same image (apps/api/test/support/postgres.ts).
name: food-delivery

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Local-only credentials, mirrored in apps/api/.env.example.
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery
      POSTGRES_DB: food_delivery
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18 images keep their data in a versioned directory below this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=food_delivery --dbname=food_delivery']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
